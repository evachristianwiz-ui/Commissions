<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO Targets & KPIs - Performance Dashboard (Live Cloud Sync)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070b19;
            --card-bg: #0f172a;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #0ea5e9;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --btn-active: #0284c7;
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-dark); 
            margin: 0; 
            padding: 30px 20px; 
            color: var(--text-main); 
        }
        
        .container { max-width: 1450px; margin: 0 auto; }
        
        .navbar { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            background: var(--card-bg); 
            padding: 16px 28px; 
            border-radius: 14px; 
            border: 1px solid var(--border-color); 
            margin-bottom: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .logo-area { display: flex; align-items: center; justify-self: start; }
        .logo-img { height: 38px; width: auto; object-fit: contain; border-radius: 6px; }
        .navbar-title { font-weight: 700; font-size: 22px; color: white; justify-self: center; }
        
        .nav-tabs-area { display: flex; gap: 10px; justify-self: end; }
        .nav-tab-btn { background: #070b19; color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .nav-tab-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

        .nav-badge { background: rgba(14, 165, 233, 0.1); color: var(--accent-blue); border: 1px solid rgba(14, 165, 233, 0.3); padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; justify-self: end; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
        .page-title { font-size: 18px; color: var(--text-muted); font-weight: 500; }
        .page-title span { color: var(--text-main); font-weight: 700; }
        
        .cycle-info-box { background: rgba(14, 165, 233, 0.1); border: 1px solid rgba(14, 165, 233, 0.3); padding: 10px 18px; border-radius: 10px; color: var(--accent-blue); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; }

        .btn-reset { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-reset:hover { background: #ef4444; color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 14px; position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent-blue); }
        .stat-card:nth-child(2)::after { background: var(--accent-green); }
        .stat-card:nth-child(3)::after { background: #ef4444; }
        .stat-card .title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: white; }

        .filters-bar { display: flex; gap: 15px; margin-bottom: 24px; flex-wrap: wrap; background: var(--card-bg); padding: 18px; border-radius: 14px; border: 1px solid var(--border-color); align-items: center; }
        select, input { padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; background: #070b19; color: white; outline: none; font-family: inherit; }
        select:focus, input:focus { border-color: var(--accent-blue); }

        .table-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow-x: auto; margin-bottom: 30px; }
        .table-header-title { padding: 18px 22px; margin: 0; color: white; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.01); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; text-align: left; }
        th, td { padding: 14px 20px; border-bottom: 1px solid var(--border-color); font-size: 13px; vertical-align: middle; }
        th { background-color: rgba(0,0,0,0.3); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }
        tr:hover { background-color: rgba(255,255,255,0.015); }

        .editable-input { width: 75px; padding: 7px 10px; background: #070b19; border: 1px solid var(--border-color); color: var(--accent-blue); font-weight: 700; border-radius: 6px; text-align: center; }
        .editable-text { background: transparent; border: none; color: white; font-weight: 600; font-size: 13px; width: 150px; padding: 6px; }
        .editable-select { background: #070b19; color: white; border: 1px solid var(--border-color); padding: 7px; border-radius: 6px; font-size: 12px; }

        .badge { padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
        .tier3 { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .tier2 { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }
        .tier1 { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .not-qualified { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .next-tier-info { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: block; font-weight: 500; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .btn-delete:hover { background: #ef4444; color: white; }
        
        .form-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 14px; margin-bottom: 30px; }
        .form-box h3 { margin-top: 0; color: white; font-size: 16px; margin-bottom: 18px; font-weight: 600; }
        .form-grid { display: flex; gap: 14px; flex-wrap: wrap; }
        .form-grid input, .form-grid select { flex: 1; min-width: 170px; }
        .btn-green { background: var(--accent-green); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        
        .view-section { display: none; }
        .view-section.active-view { display: block; }
    </style>
