<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Team Leaders Commissions CRM (Google Sheets Live)</title>
    
    <style>
        :root {
            --bg-dark: #0b1329;
            --card-bg: #111c38;
            --border-color: #1e295b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --btn-active: #0284c7;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); margin: 0; padding: 20px; color: var(--text-main); }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 24px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 20px; color: white; }
        .nav-links a { text-decoration: none; color: white; background: var(--btn-active); padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title { font-size: 16px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .page-title span { color: var(--text-main); font-weight: bold; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 10px; }
        .stat-card .title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: white; }

        .filters-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; background: var(--card-bg); padding: 16px; border-radius: 10px; border: 1px solid var(--border-color); }
        select, input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; background: #080e21; color: white; outline: none; }
        select:focus, input:focus { border-color: var(--accent-blue); }

        .table-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow-x: auto; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-size: 13px; vertical-align: middle; }
        th { background-color: rgba(0,0,0,0.2); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }
        tr:hover { background-color: rgba(255,255,255,0.02); }

        .badge { padding: 5px 10px; border-radius: 6px; font-weight: 600; font-size: 11px; display: inline-block; }
        .tier3 { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .tier2 { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .tier1 { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .not-qualified { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-active { background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="logo-area">
            <span>GGO CRM - Google Sheets Live Sync</span>
        </div>
        <div class="nav-links">
            <a href="#" onclick="fetchSheetData(); return false;">Refresh Data</a>
        </div>
    </div>

    <div class="page-header">
        <div class="page-title">
            <span>|</span> Team Leaders Commission Tracker (Sourced from Google Sheet API)
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="title">TOTAL AGENTS</div>
            <div class="value" id="totalAgentsCount">0</div>
        </div>
        <div class="stat-card">
            <div class="title">TOTAL G2G'S</div>
            <div class="value" id="totalG2GCount">0</div>
        </div>
        <div class="stat-card">
            <div class="title">TOTAL ATTENDED DAYS</div>
            <div class="value" id="totalDaysCount">0</div>
        </div>
    </div>

    <div class="filters-bar">
        <input type="text" id="searchAgent" placeholder="Search agent name..." onkeyup="renderData()" style="max-width: 250px;">
    </div>

    <div class="table-container">
        <h3 style="padding: 15px 16px; margin: 0; color: white; border-bottom: 1px solid var(--border-color);">Agents Performance (Live from Google Sheet)</h3>
        <table>
            <thead>
                <tr>
                    <th>Agent Name</th>
                    <th>Total G2G'S</th>
                    <th>Attended Days</th>
                    <th>Agent Ratio</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="sheetTableBody">
                <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading data from Google Sheet...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbyGCD4UHc1Ivy-PMZiDsYLUA61CO_3MUA22N3cIZDSGYMhVFNefpx1I4eOJuCN6LRARIg/exec";
    let sheetData = [];

    async function fetchSheetData() {
        try {
            document.getElementById("sheetTableBody").innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Fetching live data...</td></tr>`;
            let response = await fetch(scriptUrl);
            sheetData = await response.json();
            renderData();
        } catch (error) {
            console.error("Error fetching Google Sheet data:", error);
            document.getElementById("sheetTableBody").innerHTML = `<tr><td colspan="5" style="text-align: center; color: #f87171;">Failed to load data. Make sure deployment is set to 'Anyone'.</td></tr>`;
        }
    }

    function renderData() {
        const searchQuery = document.getElementById("searchAgent").value.toLowerCase();
        const tbody = document.getElementById("sheetTableBody");
        tbody.innerHTML = "";

        let totalG2GSum = 0;
        let totalDaysSum = 0;
        let validAgentsCount = 0;

        sheetData.forEach(row => {
            let agentName = row["AGENT NAME"] || row["Agent Name"] || "";
            // Skip empty rows or section headers like ORT, CGM
            if (!agentName || agentName === "ORT" || agentName === "CGM" || agentName.includes("Number of agents")) return;

            if (agentName.toLowerCase().includes(searchQuery)) {
                let g2g = parseFloat(row["Total G2G'S"] || row["Total G2G's"] || 0);
                let days = parseFloat(row["Attended Days"] || 0);
                let ratio = days > 0 ? (g2g / days).toFixed(2) : 0;

                totalG2GSum += g2g;
                totalDaysSum += days;
                validAgentsCount++;

                let htmlRow = `<tr>
                    <td><b>${agentName}</b></td>
                    <td><b style="color: var(--accent-blue);">${g2g}</b></td>
                    <td>${days}</td>
                    <td><b>${ratio}</b></td>
                    <td><span class="status-active">Active</span></td>
                </tr>`;
                tbody.innerHTML += htmlRow;
            }
        });

        document.getElementById("totalAgentsCount").innerText = validAgentsCount;
        document.getElementById("totalG2GCount").innerText = totalG2GSum;
        document.getElementById("totalDaysCount").innerText = totalDaysSum;
    }

    // Initial fetch
    fetchSheetData();
</script>

</body>
</html>
